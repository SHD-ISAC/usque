name: Build isolated Xray-Usque SOCKS fix
run-name: Xray SOCKS lifecycle - ${{ github.sha }}
on:
  push:
    branches: [xray-usque-udp-fix]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xray-usque-udp-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  test-build:
    if: github.repository == 'SHD-ISAC/usque' && github.ref == 'refs/heads/xray-usque-udp-fix'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CGO_ENABLED: "0"
      GOOS: linux
      GOARCH: amd64
      GOAMD64: v1
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify dependency checksums
        run: |
          go mod download
          go mod verify
      - name: Test all packages
        run: go test -timeout 5m ./...
      - name: Repeat UDP lifecycle tests under race detector
        run: CGO_ENABLED=1 go test -race -count=10 -timeout 5m ./internal -run '^TestSOCKSUDP'
      - name: Vet
        run: go vet ./...
      - name: Build isolated binary
        run: |
          mkdir -p dist
          gofmt internal/socks5.go > dist/socks5.go
          gofmt internal/socks5_lifecycle_test.go > dist/socks5_lifecycle_test.go
          source_epoch=$(git show -s --format=%ct HEAD)
          build_date=$(date -u -d "@$source_epoch" '+%Y-%m-%dT%H:%M:%SZ')
          version="v4.2.1-xray-usque-udpfix+${GITHUB_SHA:0:12}"
          go build -trimpath -buildvcs=true -ldflags "-s -w -X github.com/Diniboy1123/usque/cmd.version=$version -X github.com/Diniboy1123/usque/cmd.commit=$GITHUB_SHA -X github.com/Diniboy1123/usque/cmd.date=$build_date" -o dist/usque .
          ./dist/usque version
          ./dist/usque socks --help
          printf '%s\n' "$GITHUB_SHA" > dist/source-commit.txt
          go version -m dist/usque > dist/build-info.txt
          cp LICENSE.md THIRD_PARTY_NOTICES.md dist/
          (cd dist && sha256sum usque socks5.go socks5_lifecycle_test.go > SHA256SUMS)
          cat dist/SHA256SUMS
          git diff --exit-code -- go.mod go.sum
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: usque-xray-udpfix-linux-amd64-${{ github.sha }}
          path: dist/
          retention-days: 14
          if-no-files-found: error
